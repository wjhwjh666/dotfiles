# Runs scripts/ci-check.sh (same rules as scripts/hooks/pre-commit) on every PR and every push to master.
name: guard

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secrets / timezone / relay / forced-add
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-check.sh "$BASE" "$HEAD"
